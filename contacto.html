<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacto</title>
  <link href="css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">Mi Empresa</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item">
          <a class="nav-link" href="index.html">Inicio</a>
        </li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            Servicios
          </a>
          <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
            <li><a class="dropdown-item" href="servicios.html">Ver todos</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="#">Servicio A</a></li>
            <li><a class="dropdown-item" href="#">Servicio B</a></li>
          </ul>
        </li>
        <li class="nav-item me-2">
          <a class="nav-link active" href="contacto.html">Contacto</a>
        </li>
        <li class="nav-item">
          <button class="btn btn-outline-info btn-sm" data-bs-toggle="modal" data-bs-target="#loginModal">Ingresar</button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container">
  <div class="p-5 mb-4 bg-body-tertiary rounded border">
    <div class="container-fluid py-3">
      <h1 class="display-5 fw-bold">Contacto</h1>
      <p class="col-md-8 fs-4">Canales de comunicación oficiales.</p>
    </div>
  </div>

  <div class="row">
    <div class="col-md-8 mb-4">
      <div class="card">
        <div class="card-header bg-body-tertiary fw-bold">Formulario de Contacto</div>
        <div class="card-body">
          <form>
            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre</label>
              <input type="text" class="form-control" id="nombre">
            </div>
            <div class="mb-3">
              <label for="correo" class="form-label">Correo electrónico</label>
              <input type="email" class="form-control" id="correo">
            </div>
            <div class="mb-3">
              <label for="mensaje" class="form-label">Mensaje</label>
              <textarea class="form-control" id="mensaje" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-info">Enviar</button>
          </form>
        </div>
      </div>
    </div>

    <div class="col-md-4 mb-4">
      <div class="card bg-body-tertiary">
        <div class="card-body">
          <h5 class="card-title fw-bold">Datos de Contacto</h5>
          <p class="card-text"><strong>Dirección:</strong> Calle Ficticia 123</p>
          <p class="card-text"><strong>Teléfono:</strong> +56 9 1234 5678</p>
          <p class="card-text"><strong>Email:</strong> contacto@correo.com</p>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Iniciar Sesión</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="mb-3">
            <label for="correo" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="correo" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" required>
          </div>
          <button type="submit" class="btn btn-info w-100">Entrar</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
