<!DOCTYPE html>
<html lang="es">
<head>
  <title>Práctica Semana 1 - En vivo</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- CDN de Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

  <!-- Contenedor fluido que ocupa todo el ancho de la pantalla -->
  <div class="container-fluid">
    
    <!-- Fila 1: Barra de navegación completa -->
    <div class="row">
      <div class="col-12 bg-primary text-white p-3">
        Nadbar
      </div>
    </div>

    <!-- Fila 2: Columnas asimétricas basadas en el Figma (3 - 6 - 3 zonas) -->
    <div class="row">
      <div class="col-3 bg-warning text-dark p-3">
        Izquierda
      </div>
      <div class="col-6 bg-secondary text-white p-3">
        Centro
      </div>
      <div class="col-3 bg-primary text-white p-3">
        Derecha
      </div>
    </div>

    <!-- Fila 3: Tres columnas iguales (4 - 4 - 4 zonas) -->
    <div class="row">
      <div class="col-4 bg-danger text-white p-3">
        col-4
      </div>
      <div class="col-4 bg-secondary text-white p-3">
        col-4
      </div>
      <div class="col-4 bg-warning text-dark p-3">
        col-4
      </div>
    </div>

  </div>

</body>
</html>
